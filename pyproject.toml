[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectroloc"
version = "0.1.0"
description = "Cryptographic operation localization via spectrogram projection and time-series analysis."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "claspy>=0.1.1",
    "jupyter>=1.0.0",
    "pandas>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
